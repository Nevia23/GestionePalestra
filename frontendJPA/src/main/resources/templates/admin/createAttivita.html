<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
	crossorigin="anonymous"></script>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<header
		th:insert="~{fragments/navigation :: block-navigation(${titolo})}"></header>
	<div class="container-fluid mt-3" align="center">
		<div th:if="${errorMsg}" class="alert alert-danger"
			th:text="${errorMsg}"></div>

		<form class="form-content" th:action="@{saveAttivita}"
			th:object="${attivita}" method="post" style="width: 30%; margin: auto">

			<input type="hidden" th:field="*{id}">
			<!-- per far funzionare l'update -->
			<table class="table table-secondary m-25">
				<tr>
					<td><label class="form-label">Descrizione</label></td>
					<td><input type="text" th:field="*{descrizione}"
						placeholder="es. Tai Chi"></input></td>
				</tr>
				<tr>
					<td><label class="form-label">Prezzo</label></td>
					<td><input type="text" th:field="*{prezzo}"
						placeholder="es. 50"></input></td>
				</tr>
			</table>

			<div class="mt-4" align="center">
				<button type="submit" class="btn btn-primary">Registra
					attività</button>
			</div>
		</form>
	</div>
</body>
</html>
