<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
	crossorigin="anonymous"></script>
<link rel="stylesheet" th:href="@{/css/style.css}">
<title>Crea nuovo Admin</title>
</head>
<body>
	<header
		th:insert="~{fragments/navigation :: block-navigation(${titolo})}"></header>
	<div class="container-fluid mt-3" align="center">
	<div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
		<form class="form-content" th:action="@{saveAdmin}"
			th:object="${admin}" method="post" style="width: 50%; margin: auto">

			<table class="table table-secondary m-25">
				<tr>
					<td><label class="form-label">Username</label></td>
					<td><input type="text" name="username" th:field="*{username}"
						class="form-text" placeholder="username" required></td>
				</tr>
				<tr>
					<td><label class="form-label">Password</label></td>
					<td><input type="password" name="password" th:field="*{pwd}"
						class="form-text" placeholder="password" required></td>
				</tr>
				<tr>
					<td><label class="form-label">Email</label></td>
					<td><input type="email" name="email" th:field="*{email}"
						class="form-text" placeholder="email"></td>
				</tr>
			</table>

			<div class="mt-4" align="center">
				<button type="submit" class="btn btn-primary">Registra
					Admin</button>
			</div>
		</form>
	</div>
</body>
</html>
