<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
<title>Crea nuovo utente</title>
</head>

<body>

	<header
		th:insert="~{fragments/navigation :: block-navigation(${titolo})}"></header>

	<div class="container-fluid mt-3" align="center">

		<div th:if="${errorMsg}" class="alert alert-danger"
			th:text="${errorMsg}"></div>

		<form class="form-content" th:action="@{/admin/createUtente}"
			th:object="${utente}" method="post" style="width: 50%; margin: auto">

			<table class="table table-secondary m-25">

				<tr>
					<td><label class="form-label">Username</label></td>
					<td><input type="text" th:field="*{username}"
						class="form-control" placeholder="username" required></td>
				</tr>

				<tr>
					<td><label class="form-label">Password</label></td>
					<td><input type="password" th:field="*{pwd}"
						class="form-control" placeholder="password" required></td>
				</tr>

				<tr>
					<td><label class="form-label">Email</label></td>
					<td><input type="email" th:field="*{email}"
						class="form-control" placeholder="email"></td>
				</tr>

				<tr>
					<td><label class="form-label">Ruolo</label></td>
					<td><select th:field="*{role}" class="form-select" required>
							<option value="">Seleziona un ruolo</option>
							<option value="USER">USER</option>
							<option value="ADMIN">ADMIN</option>
					</select></td>
				</tr>

			</table>

			<div class="mt-4" align="center">
				<button type="submit" class="btn btn-primary">Crea utente</button>

				<a th:href="@{/admin/listUtente}" class="btn btn-secondary">
					Annulla </a>
			</div>

		</form>

	</div>
</body>
</html>
