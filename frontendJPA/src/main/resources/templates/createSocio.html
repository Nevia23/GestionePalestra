<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
	crossorigin="anonymous"></script>
<link rel="stylesheet" th:href="@{/css/style.css}">
<title>Create Socio</title>
</head>
<body>
	<header
		th:insert="~{fragments/navigation :: block-navigation(${titolo})}"></header>
	<div class="container-fluid mt-2" align="center">
		<div th:if="${errorMsg}" class="alert alert-danger"
			th:text="${errorMsg}"></div>
		<form class="form-content" th:action="@{saveSocio}"
			th:object="${socio}" method="post" style="width: 50%; margin: auto">

			<input type="hidden" th:field="*{id}">
			<!-- per far funzionare l'update -->
			<table class="table table-secondary m-25">
				<tr>
					<td><label class="form-label">Nome</label></td>
					<td><input type="text" th:field="*{nome}"
						placeholder="es. Andrea"></input></td>
				</tr>
				<tr>
					<td><label class="form-label">Cognome</label></td>
					<td><input type="text" th:field="*{cognome}"
						placeholder="es. Rossi"></input></td>
				</tr>
				<tr>
					<td><label class="form-label">Codice fiscale</label></td>
					<td><input type="text" th:field="*{codiceFiscale}"
						placeholder="es. ADRRSS..."></input></td>
				</tr>
				<tr>
					<td><label class="form-label">Email</label></td>
					<td><input type="email" th:field="*{email}"
						placeholder="es. nome.cognome@email.it"></input></td>
				</tr>
			</table>

			<div class="mt-4" align="center">
				<button type="submit" class="btn btn-primary">Registra
					socio</button>
			</div>
		</form>
	</div>
</body>
</html>
