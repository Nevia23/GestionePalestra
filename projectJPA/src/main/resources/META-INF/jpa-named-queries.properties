socio.cognome.like=select s from Socio s where cognome like :cognome%

socio.selectByAttivita=select s from Socio s \
inner join s.abbonamento abb \
inner join abb.attivita att \
where att.id = :id

socio.filterByOptionalParameters=select s from Socio s \
left join s.abbonamento abb \
left join abb.attivita att \
where (s.id = :id OR :id IS NULL) \
and (s.nome like concat(:nome, '%') or (:nome is null)) \
and (s.cognome like concat(:cognome, '%') or (:cognome is null)) \
and (att.id = :attivita or :attivita is null)